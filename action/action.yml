name: "SpecPrism PR Spec-Drift Guard"
description: "Validates REQ-* to TC-* zero-orphan traceability, EARS SHALL clauses, vertical slices, and posts Stage 5 Regression Shield PR summaries."
author: "orphik"
branding:
  icon: "shield"
  color: "purple"

inputs:
  spec-path:
    description: "Path to spec.json relative to repository root"
    required: false
    default: "specprism/spec.json"
  base-spec-path:
    description: "Optional baseline spec.json path (auto-extracted from PR base branch if omitted)"
    required: false
    default: ""
  post-pr-comment:
    description: "Post or update an idempotent PR summary comment on pull_request events"
    required: false
    default: "true"
  test-report-path:
    description: "Optional Vitest JSON, Playwright JSON, or JUnit XML report path to append Post-Code UAT Readiness to PR summary"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Run Deterministic SpecPrism Drift Guard
      id: guard
      shell: bash
      env:
        INPUT_SPEC: ${{ inputs.spec-path }}
        INPUT_BASE: ${{ inputs.base-spec-path }}
        BASE_REF: ${{ github.base_ref }}
      run: |
        set +e
        BASE_ARG=""
        if [ -n "$INPUT_BASE" ] && [ -f "$INPUT_BASE" ]; then
          BASE_ARG="--base $INPUT_BASE"
        elif [ -n "$BASE_REF" ]; then
          if git show "origin/${BASE_REF}:${INPUT_SPEC}" > /tmp/specprism-base-spec.json 2>/dev/null; then
            BASE_ARG="--base /tmp/specprism-base-spec.json"
          fi
        fi

        node "${{ github.action_path }}/../skills/specprism/scripts/ci-guard.mjs" \
          --spec "$INPUT_SPEC" \
          $BASE_ARG \
          --out /tmp/specprism-pr-guard.md
        EXIT_CODE=$?

        if [ -n "${{ inputs.test-report-path }}" ] && [ -f "${{ inputs.test-report-path }}" ]; then
          node "${{ github.action_path }}/../skills/specprism/scripts/verify-uat.mjs" \
            --spec "$INPUT_SPEC" \
            --report "${{ inputs.test-report-path }}" \
            --out /tmp/specprism-uat-summary.md
          echo "" >> /tmp/specprism-pr-guard.md
          cat /tmp/specprism-uat-summary.md >> /tmp/specprism-pr-guard.md
        fi

        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upsert Idempotent Pull Request Spec Summary Comment
      if: ${{ github.event_name == 'pull_request' && inputs.post-pr-comment == 'true' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require("node:fs");
          if (!fs.existsSync("/tmp/specprism-pr-guard.md")) return;
          const body = fs.readFileSync("/tmp/specprism-pr-guard.md", "utf8");
          const marker = "<!-- specprism-pr-guard -->";
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const { data: comments } = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number,
            per_page: 50,
          });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }

    - name: Enforce Zero-Orphan Gate Exit Status
      shell: bash
      run: |
        if [ "${{ steps.guard.outputs.exit_code }}" != "0" ]; then
          echo "::error::SpecPrism PR Spec-Drift Guard blocked merge due to traceability or EARS violations."
          exit 1
        fi
