id: meta-llama
displayName: Meta Llama Family (Structured Markdown Checklists + Concrete I/O)
version: "2026.11.2"
lastVerifiedAt: "2026-11-26T20:00:00.000Z"
modelMatchers:
  - "meta-llama/*"
  - "meta/*"
  - "llama-*"
structuralFormat: markdown_headings
reasoningStrategy: guided_stepwise_plan
rules:
  avoidPhrases: []
  systemFramingTemplate: |
    Structured Implementation Checklist: Complete one vertical story slice at a time. Check off every REQ-* EARS requirement by passing its corresponding TC-* test case.
  handoffSectionOrder:
    - "## Scoped Vision & Non-Goals"
    - "## Locked Assumptions"
    - "## Vertical Stories"
    - "## Acceptance Criteria (EARS)"
    - "## Verification Matrix (REQ -> TC)"
  toolUseGuidance: |
    Follow the explicit 3-layer touchpoints (Entry Surface, Domain Logic, Persistence) for each story and run deterministic test commands after every completed story.
coachAnnotations:
  - ruleKey: structured_stepwise_checklist
    badgeLabel: Stepwise Story Checklists
    explanation: Open-weight Llama 3.3 and Llama 4 models maintain highest instruction fidelity when requirements are structured as explicit story-scoped checklists.
